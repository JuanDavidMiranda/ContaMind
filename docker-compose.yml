services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: contamind
      POSTGRES_PASSWORD: contamind
      POSTGRES_DB: contamind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contamind -d contamind"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://contamind:contamind@db:5432/contamind
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
